<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VISION AI</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #020006;
    color: white;
}

body {
    perspective: 1000px;
}

/* BACKGROUND */

.space {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center,
        rgba(255,210,0,0.12),
        transparent 25%),
        radial-gradient(circle at center,
        #160b00 0%,
        #050008 45%,
        #000 100%);
    overflow: hidden;
}

/* PARTICLES */

.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ffd84d;
    border-radius: 50%;
    box-shadow: 0 0 12px #ffd84d;
    animation: float 8s infinite linear;
}

@keyframes float {
    from {
        transform: translateY(110vh) translateZ(0);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    to {
        transform: translateY(-10vh) translateZ(300px);
        opacity: 0;
    }
}

/* TOP BAR */

.top {
    position: fixed;
    top: 20px;
    left: 25px;
    right: 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.logo {
    font-size: 25px;
    letter-spacing: 7px;
    font-weight: bold;
    color: #ffe66b;
    text-shadow:
        0 0 10px #ffcf00,
        0 0 25px #ffb300;
}

.status {
    font-size: 12px;
    letter-spacing: 3px;
    color: #d9d9d9;
}

.status span {
    color: #00ff99;
}

/* MAIN 3D AREA */

.scene {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
}

/* ENERGY RINGS */

.ring {
    position: absolute;
    width: 360px;
    height: 360px;
    border: 1px solid rgba(255,210,50,0.35);
    border-radius: 50%;
    transform-style: preserve-3d;
}

.ring1 {
    animation: rotate1 14s linear infinite;
}

.ring2 {
    width: 430px;
    height: 430px;
    border-color: rgba(255,150,0,0.25);
    animation: rotate2 18s linear infinite reverse;
}

.ring3 {
    width: 510px;
    height: 510px;
    border-color: rgba(255,230,80,0.12);
    animation: rotate3 25s linear infinite;
}

@keyframes rotate1 {
    from {
        transform: rotateX(65deg) rotateZ(0deg);
    }

    to {
        transform: rotateX(65deg) rotateZ(360deg);
    }
}

@keyframes rotate2 {
    from {
        transform: rotateY(65deg) rotateZ(0deg);
    }

    to {
        transform: rotateY(65deg) rotateZ(360deg);
    }
}

@keyframes rotate3 {
    from {
        transform: rotateX(70deg) rotateY(30deg) rotateZ(0deg);
    }

    to {
        transform: rotateX(70deg) rotateY(30deg) rotateZ(360deg);
    }
}

/* MIND STONE */

.stone {
    position: relative;
    width: 145px;
    height: 190px;
    transform-style: preserve-3d;
    transform: rotateX(12deg) rotateY(-18deg);
    animation: stoneFloat 5s ease-in-out infinite;
    z-index: 5;
}

@keyframes stoneFloat {

    0%,100% {
        transform:
            translateY(0)
            rotateX(12deg)
            rotateY(-18deg);
    }

    50% {
        transform:
            translateY(-18px)
            rotateX(18deg)
            rotateY(18deg);
    }
}

.stone-core {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(135deg,
        #fff36b 0%,
        #ffd000 25%,
        #ff9d00 55%,
        #ff5e00 100%);
    clip-path: polygon(
        50% 0%,
        88% 15%,
        100% 52%,
        80% 90%,
        50% 100%,
        20% 90%,
        0% 52%,
        12% 15%
    );

    box-shadow:
        0 0 30px #ffd000,
        0 0 70px #ff9d00,
        0 0 140px rgba(255,130,0,0.8);

    filter: saturate(1.4);
}

/* INNER ENERGY */

.energy {
    position: absolute;
    inset: 25px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        white 0%,
        #fff58c 10%,
        #ffd000 35%,
        transparent 70%
    );

    filter: blur(4px);
    animation: pulse 2s infinite alternate;
}

@keyframes pulse {

    from {
        transform: scale(.8);
        opacity: .7;
    }

    to {
        transform: scale(1.2);
        opacity: 1;
    }
}

/* VISION */

.identity {
    position: absolute;
    top: calc(50% + 155px);
    text-align: center;
    z-index: 8;
}

.identity h1 {
    margin: 0;
    font-size: 52px;
    letter-spacing: 15px;
    color: #fff2a6;

    text-shadow:
        0 0 10px #fff000,
        0 0 30px #ffb000,
        0 0 70px #ff7000;
}

.identity p {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 5px;
    color: #aaa;
}

/* CHAT */

.chat {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    width: min(750px, 92%);
    z-index: 20;
}

.response {
    min-height: 60px;
    max-height: 150px;
    overflow-y: auto;

    padding: 15px 20px;
    margin-bottom: 10px;

    border: 1px solid rgba(255,210,50,.25);
    border-radius: 15px;

    background: rgba(0,0,0,.55);
    backdrop-filter: blur(15px);

    box-shadow:
        0 0 25px rgba(255,190,0,.08);
}

.response .name {
    color: #ffd83d;
    font-size: 11px;
    letter-spacing: 3px;
    margin-bottom: 6px;
}

.input-area {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 15px 18px;

    border-radius: 30px;
    border: 1px solid rgba(255,210,50,.35);

    background: rgba(0,0,0,.75);
    color: white;

    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #ffd000;
    box-shadow: 0 0 15px rgba(255,210,0,.2);
}

button {
    width: 52px;
    height: 52px;

    border: none;
    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #fff36b,
        #ff9d00
    );

    color: #170900;

    font-size: 20px;
    cursor: pointer;

    box-shadow:
        0 0 15px rgba(255,200,0,.6);

    transition: .2s;
}

button:hover {
    transform: scale(1.08);
}

button:active {
    transform: scale(.95);
}

/* MOBILE */

@media(max-width:600px) {

    .logo {
        font-size: 18px;
        letter-spacing: 4px;
    }

    .status {
        display: none;
    }

    .stone {
        width: 105px;
        height: 140px;
    }

    .ring {
        width: 260px;
        height: 260px;
    }

    .ring2 {
        width: 310px;
        height: 310px;
    }

    .ring3 {
        width: 360px;
        height: 360px;
    }

    .identity {
        top: calc(50% + 120px);
    }

    .identity h1 {
        font-size: 34px;
        letter-spacing: 8px;
    }

    .identity p {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<div class="space" id="space"></div>

<div class="top">
    <div class="logo">VISION</div>

    <div class="status">
        SYSTEM <span>● ONLINE</span>
    </div>
</div>

<div class="scene">

    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>

    <div class="stone">
        <div class="stone-core"></div>
        <div class="energy"></div>
    </div>

    <div class="identity">
        <h1>VISION</h1>
        <p>INTELLIGENCE • AWARENESS • RESPONSE</p>
    </div>

</div>

<div class="chat">

    <div class="response">

        <div class="name">VISION</div>

        <div id="answer">
            Systems online. Hello AJIT.
        </div>

    </div>

    <div class="input-area">

        <input
            id="message"
            placeholder="Speak to VISION..."
            autocomplete="off"
        >

        <button id="mic">🎙</button>

        <button id="send">➤</button>

    </div>

</div>

<script>

/* PARTICLES */

const space = document.getElementById("space");

for(let i = 0; i < 90; i++){

    const p = document.createElement("div");

    p.className = "particle";

    p.style.left = Math.random() * 100 + "%";

    p.style.animationDelay =
        Math.random() * 8 + "s";

    p.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    space.appendChild(p);
}


/* ELEMENTS */

const input = document.getElementById("message");
const send = document.getElementById("send");
const mic = document.getElementById("mic");
const answer = document.getElementById("answer");


/* TALK */

async function askVision(){

    const message = input.value.trim();

    if(!message) return;

    answer.innerText = "Thinking...";

    send.disabled = true;

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        if(data.reply){

            answer.innerText = data.reply;

            speak(data.reply);

        } else {

            answer.innerText =
                "VISION could not process that request.";

        }

    } catch(error){

        console.error(error);

        answer.innerText =
            "Connection error. VISION cannot reach its AI core.";

    }

    input.value = "";

    send.disabled = false;
}


/* SEND */

send.addEventListener("click", askVision);


/* ENTER */

input.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        askVision();

    }

});


/* VOICE OUTPUT */

function speak(text){

    if(!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.rate = 1;
    speech.pitch = .85;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}


/* VOICE INPUT */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = false;

    recognition.interimResults = false;


    mic.addEventListener("click", function(){

        recognition.start();

        mic.innerText = "🔴";

    });


    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;

        input.value = text;

        mic.innerText = "🎙";

        askVision();

    };


    recognition.onerror = function(){

        mic.innerText = "🎙";

    };


    recognition.onend = function(){

        mic.innerText = "🎙";

    };

}else{

    mic.style.display = "none";

}

</script>

</body>
</html>
