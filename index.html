<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VISION AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#080500;
    color:#ffe7a0;
}

/* MAIN ENVIRONMENT */

#scene{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* DARK GOLD OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            rgba(255,190,40,.08),
            transparent 35%
        ),
        linear-gradient(
            rgba(0,0,0,.12),
            rgba(0,0,0,.45)
        );
}

/* TOP BAR */

.topbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;

    height:75px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 35px;

    z-index:5;

    border-bottom:1px solid rgba(255,205,70,.25);

    background:rgba(5,3,0,.35);

    backdrop-filter:blur(10px);
}

.logo{
    font-size:27px;
    font-weight:bold;
    letter-spacing:10px;

    color:#ffd45c;

    text-shadow:
        0 0 8px #ffb300,
        0 0 25px #ff8c00,
        0 0 50px rgba(255,180,0,.8);
}

.identity{
    font-size:13px;
    letter-spacing:3px;
    color:#d9b65c;
}

.identity span{
    color:#fff0a8;
}

/* CENTER AI DISPLAY */

.centerUI{
    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:4;

    text-align:center;

    pointer-events:none;
}

.aiName{
    font-size:42px;
    letter-spacing:14px;
    font-weight:bold;

    color:#fff0a0;

    text-shadow:
        0 0 10px #ffd000,
        0 0 30px #ffae00,
        0 0 80px #ff8a00;
}

.status{
    margin-top:12px;

    font-size:12px;
    letter-spacing:5px;

    color:#dcb65b;
}

.statusDot{
    display:inline-block;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffd43b;

    box-shadow:
        0 0 8px #ffd43b,
        0 0 20px #ff9d00;

    animation:pulse 1.4s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.4;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }

}

/* CHAT PANEL */

.chat{
    position:absolute;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    width:min(760px,92%);

    z-index:10;

    background:rgba(12,8,0,.72);

    border:1px solid rgba(255,204,65,.4);

    border-radius:18px;

    box-shadow:
        0 0 20px rgba(255,166,0,.12),
        inset 0 0 30px rgba(255,170,0,.04);

    backdrop-filter:blur(15px);

    overflow:hidden;
}

.messages{
    height:150px;

    overflow-y:auto;

    padding:15px 20px;

    font-size:14px;

    line-height:1.6;
}

.message{
    margin-bottom:8px;
}

.vision{
    color:#ffd75b;
}

.user{
    color:#fff3c0;
}

.inputArea{
    display:flex;

    padding:10px;

    gap:8px;

    border-top:1px solid rgba(255,200,60,.2);
}

#input{
    flex:1;

    background:rgba(255,220,100,.05);

    border:1px solid rgba(255,204,65,.35);

    border-radius:10px;

    padding:13px;

    outline:none;

    color:#fff2ba;

    font-size:14px;
}

#input::placeholder{
    color:#987f43;
}

button{
    border:none;

    border-radius:10px;

    padding:0 18px;

    cursor:pointer;

    color:#241600;

    background:linear-gradient(
        135deg,
        #fff09a,
        #ffbf22,
        #ff8b00
    );

    font-weight:bold;

    box-shadow:
        0 0 12px rgba(255,170,0,.4);

    transition:.2s;
}

button:hover{
    transform:scale(1.05);

    box-shadow:
        0 0 25px rgba(255,190,0,.8);
}

.mic{
    width:48px;
    padding:0;
}

/* SIDE INFORMATION */

.sidePanel{

    position:absolute;

    right:25px;
    top:110px;

    width:190px;

    z-index:5;

    padding:15px;

    border:1px solid rgba(255,200,70,.22);

    background:rgba(8,5,0,.4);

    backdrop-filter:blur(10px);

    border-radius:12px;

    font-size:10px;

    letter-spacing:2px;

    color:#b79a50;
}

.sidePanel h3{

    color:#ffe48b;

    font-size:11px;

    margin-bottom:12px;

    letter-spacing:3px;
}

.data{
    margin:9px 0;
}

.bar{
    height:3px;

    margin-top:5px;

    background:#332400;

    overflow:hidden;

    border-radius:5px;
}

.bar div{

    height:100%;

    width:80%;

    background:#ffc400;

    box-shadow:0 0 8px #ffb000;

    animation:dataPulse 2s infinite alternate;
}

@keyframes dataPulse{

    from{
        width:45%;
    }

    to{
        width:95%;
    }

}

/* MOBILE */

@media(max-width:700px){

    .topbar{
        padding:0 15px;
        height:60px;
    }

    .logo{
        font-size:19px;
        letter-spacing:6px;
    }

    .identity{
        font-size:9px;
    }

    .aiName{
        font-size:30px;
        letter-spacing:8px;
    }

    .sidePanel{
        display:none;
    }

    .chat{
        bottom:15px;
    }

}

</style>
</head>

<body>

<div id="scene"></div>

<div class="overlay"></div>

<!-- TOP -->

<div class="topbar">

    <div class="logo">
        V.I.S.I.O.N.
    </div>

    <div class="identity">
        USER RECOGNIZED:
        <span>AJIT</span>
    </div>

</div>


<!-- CENTER -->

<div class="centerUI">

    <div class="aiName">
        VISION
    </div>

    <div class="status">
        <span class="statusDot"></span>
        &nbsp; NEURAL CORE ONLINE
    </div>

</div>


<!-- SIDE DATA -->

<div class="sidePanel">

    <h3>CORE SYSTEM</h3>

    <div class="data">
        ENERGY
        <div class="bar">
            <div></div>
        </div>
    </div>

    <div class="data">
        NEURAL LINK
        <div class="bar">
            <div></div>
        </div>
    </div>

    <div class="data">
        PROCESSING
        <div class="bar">
            <div></div>
        </div>
    </div>

    <div class="data">
        CORE STABILITY
        <div class="bar">
            <div></div>
        </div>
    </div>

</div>


<!-- CHAT -->

<div class="chat">

    <div class="messages" id="messages">

        <div class="message vision">
            VISION: System online.
        </div>

        <div class="message vision">
            VISION: Identity recognized — AJIT.
        </div>

        <div class="message vision">
            VISION: Neural core initialized.
        </div>

    </div>

    <div class="inputArea">

        <input
            id="input"
            type="text"
            placeholder="Talk to VISION..."
        >

        <button onclick="sendMessage()">
            SEND
        </button>

        <button
            class="mic"
            onclick="startVoice()"
            title="Voice"
        >
            🎙
        </button>

    </div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =========================================
   VISION 3D CORE
========================================= */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    0,
    0,
    8
);


const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });


renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


document
    .getElementById("scene")
    .appendChild(renderer.domElement);


/* =========================================
   LIGHTING
========================================= */

const ambient =
    new THREE.AmbientLight(
        0xffcc55,
        0.35
    );

scene.add(ambient);


const coreLight =
    new THREE.PointLight(
        0xffb300,
        12,
        20
    );

scene.add(coreLight);


/* =========================================
   CENTRAL ENERGY CRYSTAL
========================================= */

const crystalGeometry =
    new THREE.IcosahedronGeometry(
        1.55,
        2
    );


const crystalMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0xffc928,

        emissive:0xff8c00,

        emissiveIntensity:2.5,

        metalness:.25,

        roughness:.12,

        transmission:.15,

        transparent:true,

        opacity:.94,

        clearcoat:1,

        clearcoatRoughness:.05

    });


const crystal =
    new THREE.Mesh(
        crystalGeometry,
        crystalMaterial
    );


scene.add(crystal);


/* =========================================
   INNER CORE
========================================= */

const innerGeometry =
    new THREE.IcosahedronGeometry(
        .72,
        3
    );


const innerMaterial =
    new THREE.MeshBasicMaterial({

        color:0xfff1a0,

        transparent:true,

        opacity:.85

    });


const innerCore =
    new THREE.Mesh(
        innerGeometry,
        innerMaterial
    );


scene.add(innerCore);


/* =========================================
   OUTER CRYSTAL SHELL
========================================= */

const shellGeometry =
    new THREE.IcosahedronGeometry(
        1.85,
        2
    );


const shellMaterial =
    new THREE.MeshBasicMaterial({

        color:0xffb300,

        wireframe:true,

        transparent:true,

        opacity:.18

    });


const shell =
    new THREE.Mesh(
        shellGeometry,
        shellMaterial
    );


scene.add(shell);


/* =========================================
   ENERGY RINGS
========================================= */

const rings = [];


for(let i=0;i<5;i++){

    const geometry =
        new THREE.TorusGeometry(
            2.1 + i*.25,
            .025 + i*.005,
            12,
            100
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                i % 2 === 0
                ? 0xffd84a
                : 0xff9d00,

            transparent:true,

            opacity:.65

        });


    const ring =
        new THREE.Mesh(
            geometry,
            material
        );


    ring.rotation.x =
        Math.random()*Math.PI;

    ring.rotation.y =
        Math.random()*Math.PI;

    ring.rotation.z =
        Math.random()*Math.PI;


    scene.add(ring);

    rings.push(ring);

}


/* =========================================
   PARTICLES
========================================= */

const particleCount =
    2600;


const positions =
    new Float32Array(
        particleCount * 3
    );


for(let i=0;i<particleCount;i++){

    const radius =
        3 + Math.random()*7;

    const theta =
        Math.random()*Math.PI*2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    positions[i*3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    positions[i*3+1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    positions[i*3+2] =
        radius *
        Math.cos(phi);

}


const particleGeometry =
    new THREE.BufferGeometry();


particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({

        color:0xffd75a,

        size:.025,

        transparent:true,

        opacity:.8,

        blending:
            THREE.AdditiveBlending

    });


const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );


scene.add(particles);


/* =========================================
   ENERGY BEAMS
========================================= */

const beams = [];


for(let i=0;i<10;i++){

    const geometry =
        new THREE.CylinderGeometry(
            .008,
            .025,
            5,
            8
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:0xffb300,

            transparent:true,

            opacity:.25

        });


    const beam =
        new THREE.Mesh(
            geometry,
            material
        );


    beam.rotation.x =
        Math.random()*Math.PI;

    beam.rotation.z =
        Math.random()*Math.PI;


    scene.add(beam);

    beams.push(beam);

}


/* =========================================
   MOUSE INTERACTION
========================================= */

let mouseX = 0;
let mouseY = 0;


document.addEventListener(
    "mousemove",
    event => {

        mouseX =
            (event.clientX /
            window.innerWidth - .5) * 2;

        mouseY =
            (event.clientY /
            window.innerHeight - .5) * 2;

    }
);


/* =========================================
   ANIMATION
========================================= */

const clock =
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    crystal.rotation.x =
        time * .18;

    crystal.rotation.y =
        time * .25;


    innerCore.rotation.x =
        -time * .35;

    innerCore.rotation.y =
        time * .45;


    shell.rotation.x =
        time * .08;

    shell.rotation.y =
        -time * .12;


    rings.forEach(
        (ring,index) => {

            ring.rotation.x +=
                .0015 * (index+1);

            ring.rotation.y +=
                .002 * (index+1);

            ring.rotation.z +=
                .0007 * (index+1);

        }
    );


    particles.rotation.y =
        time * .018;

    particles.rotation.x =
        Math.sin(time*.15)*.08;


    beams.forEach(
        (beam,index) => {

            beam.rotation.y +=
                .001 * (index+1);

            beam.rotation.x +=
                .0006 * (index+1);

        }
    );


    /* CAMERA PARALLAX */

    camera.position.x +=
        ((mouseX*.35) -
        camera.position.x) * .025;

    camera.position.y +=
        ((-mouseY*.25) -
        camera.position.y) * .025;


    camera.lookAt(
        0,
        0,
        0
    );


    /* CORE PULSE */

    const pulse =
        1 +
        Math.sin(time*2.2)*.035;

    crystal.scale.set(
        pulse,
        pulse,
        pulse
    );


    coreLight.intensity =
        10 +
        Math.sin(time*3)*3;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================
   CHAT SYSTEM
========================================= */

function addMessage(
    text,
    type
){

    const messages =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " + type;


    div.innerText =
        text;


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================
   VISION RESPONSE
========================================= */

function visionResponse(
    question
){

    const q =
        question.toLowerCase();


    if(
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("hey")
    ){

        return "Hello AJIT. VISION neural core is online.";

    }


    if(
        q.includes("who am i") ||
        q.includes("my name")
    ){

        return "You are AJIT. Identity confirmed.";

    }


    if(
        q.includes("who are you")
    ){

        return "I am VISION, an advanced personal AI interface.";

    }


    if(
        q.includes("status")
    ){

        return "All systems operational. Neural core stable.";

    }


    if(
        q.includes("vision")
    ){

        return "Yes AJIT. I am listening.";

    }


    return "I received your command, AJIT. My neural interface is ready for further instructions.";

}


/* =========================================
   SEND MESSAGE
========================================= */

function sendMessage(){

    const input =
        document.getElementById(
            "input"
        );


    const text =
        input.value.trim();


    if(!text)
        return;


    addMessage(
        "AJIT: " + text,
        "user"
    );


    input.value = "";


    setTimeout(
        () => {

            const answer =
                visionResponse(
                    text
                );


            addMessage(
                "VISION: " + answer,
                "vision"
            );


            speak(answer);

        },
        500
    );

}


/* ENTER KEY */

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){

                sendMessage();

            }

        }
    );


/* =========================================
   VOICE
========================================= */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        addMessage(
            "VISION: Voice recognition is not supported by this browser.",
            "vision"
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-IN";


    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            addMessage(
                "VISION: Listening...",
                "vision"
            );

        };


    recognition.onresult =
        event => {

            const text =
                event.results[0][0]
                .transcript;


            document.getElementById(
                "input"
            ).value = text;


            sendMessage();

        };


    recognition.onerror =
        () => {

            addMessage(
                "VISION: I could not hear you clearly.",
                "vision"
            );

        };


    recognition.start();

}


/* =========================================
   TEXT TO SPEECH
========================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    )
        return;


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-IN";


    speech.rate =
        .92;


    speech.pitch =
        .85;


    speech.volume =
        1;


    window.speechSynthesis.speak(
        speech
    );

}

</script>

</body>
</html>
